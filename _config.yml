# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.

# Site Settings
locale                   : "en-US"
title                    : "Muhammad Sharipow"
title_separator          : "-"
name                     : "Muhammad Sharipow"
description              : "An aspiring researcher based in Tajikistan, specializing in theoretical physics."
url                      : "https://durandesh88-bit.github.io"
baseurl                  : "/sharipowmuhammad-bit.github.io"
repository               : "durandesh88-bit/sharipowmuhammad-bit.github.io"

# Site Author
author:
  name             : "Muhammad Sharipow"
  avatar           : # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio              : "Aspiring researcher in theoretical physics."
  location         : "Tajikistan"
  email            : "your-email@example.com" # Замени на свою почту
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:your-email@example.com" # Замени на свою почту
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/durandesh88-bit"

# Site Settings (Jekyll)
remote_theme             : # Оставь пустым
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
